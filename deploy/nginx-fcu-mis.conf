# Installed by deploy/setup.sh with __DOMAIN__ replaced. certbot adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Scanned forms are up to 5 MB each; leave some room for the form fields.
    client_max_body_size 12m;

    location / {
        proxy_pass http://unix:/run/fcu-mis/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django needs this to know the visitor used HTTPS (secure cookies, redirects).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Slow down password guessing on the login page.
    location = /accounts/login/ {
        limit_req zone=fcu_login burst=10 nodelay;
        proxy_pass http://unix:/run/fcu-mis/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
