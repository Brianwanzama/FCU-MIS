name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fcu_mis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fcu_mis
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: No model changes without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Production settings pass Django's deployment checks
        run: DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py check --deploy --fail-level WARNING

      - name: Static files collect with the production storage
        run: DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py collectstatic --noinput

      - name: Tests
        run: python manage.py test --noinput
